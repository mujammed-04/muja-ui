name: Deploy Storybook

on:
  push:
    branches: [main]
  workflow_dispatch:

# Needed by actions/deploy-pages: read the repo, write a Pages deployment and
# mint the OIDC token it authenticates with.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; let a newer commit finish instead of
# cancelling it mid-deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build static Storybook
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The stories import the package sources through Vite aliases, so this
      # needs no prior `turbo build`.
      - name: Build Storybook
        run: pnpm build-storybook

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/storybook/storybook-static

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
